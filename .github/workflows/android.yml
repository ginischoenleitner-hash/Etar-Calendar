name: Android CI with Gradle

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Always sign with the same debug key, so a new APK can be installed over the old one without losing data
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp .github/zyklus-debug.keystore ~/.android/debug.keystore
      - name: Build with Gradle
        run: |
          ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: etar-zyklus-apk
          path: app/build/outputs/apk/debug/app-debug.apk
